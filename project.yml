# Framely — XcodeGen spec
# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: Framely

options:
  bundleIdPrefix: com.widget
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    DEVELOPMENT_TEAM: ""                 # <- set your Team ID (or pick it in Xcode › Signing)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Framely:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: FramelyWidgets
        embed: true
    entitlements:
      path: Config/Framely.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.widget.framely
    info:
      path: Config/Framely-Info.plist
      properties:
        CFBundleDisplayName: Framely
        LSApplicationCategoryType: public.app-category.photography
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "Framely reads the albums you choose so their photos can appear in your widgets. Photos never leave your iPhone."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.widget.framely
            CFBundleURLSchemes:
              - framely
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.widget.framely
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIUserInterfaceStyle: ""
    scheme:
      storeKitConfiguration: App/Resources/Framely.storekit

  FramelyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    entitlements:
      path: Config/FramelyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.widget.framely
    info:
      path: Config/FramelyWidgets-Info.plist
      properties:
        CFBundleDisplayName: Framely
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.widget.framely.widgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
